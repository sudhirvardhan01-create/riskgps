version: "3.8"

services:
  frontend:
    image: ${FRONTEND_IMAGE_URL}:${IMAGE_TAG}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - webnet
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE_URL}:${IMAGE_TAG}
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - webnet
    restart: unless-stopped

  db:
    image: postgres:15
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - webnet

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_DIR}:/etc/nginx/ssl:ro
    environment:
      - ENVIRONMENT_DOMAIN=${ENVIRONMENT_DOMAIN}
    depends_on:
      - frontend
      - backend
    networks:
      - webnet
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "envsubst '$$ENVIRONMENT_DOMAIN'
      < /etc/nginx/nginx.conf
      > /tmp/nginx.conf
      && nginx -c /tmp/nginx.conf -g 'daemon off;'"

volumes:
  pgdata:

networks:
  webnet:
    driver: bridge
