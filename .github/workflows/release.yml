name: Docker Build, Scan, and Push to AWS ECR

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_BRANCHES: '["dev", "prod"]'

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set-env.outputs.branch }}
      environment: ${{ steps.set-env.outputs.environment }}
      run-tests: ${{ steps.set-env.outputs.run-tests }}
      is-push-event: ${{ steps.set-env.outputs.is-push-event }}
      should-build: ${{ steps.set-env.outputs.should-build }}
      should-push: ${{ steps.set-env.outputs.should-push }}
    steps:
      - name: Determine environment and actions based on branch
        id: set-env
        run: |
          BRANCH="${{ github.ref_name }}"
          EVENT_NAME="${{ github.event_name }}"
          DEPLOY_BRANCHES='${{ env.DEPLOY_BRANCHES }}'
          
          echo "🔍 Workflow Trigger Info:"
          echo "  Branch: $BRANCH"
          echo "  Event: $EVENT_NAME"
          echo "  Deploy Branches: $DEPLOY_BRANCHES"
          
          # Determine if this is a push event (not a PR)
          if [[ "$EVENT_NAME" == "push" ]]; then
            IS_PUSH="true"
          else
            IS_PUSH="false"
          fi
          
          # Check if branch is in deploy branches list
          IS_DEPLOY_BRANCH=$(echo "$DEPLOY_BRANCHES" | grep -q "\"$BRANCH\"" && echo "true" || echo "false")
          
          # Determine environment based on branch
          case "$BRANCH" in
            dev)
              ENVIRONMENT="dev"
              RUN_TESTS="true"
              SHOULD_BUILD="true"
              # Push to ECR only on push event to dev branch
              if [[ "$IS_PUSH" == "true" ]]; then
                SHOULD_PUSH="true"
              else
                SHOULD_PUSH="false"
              fi
              ;;
            prod)
              ENVIRONMENT="prod"
              RUN_TESTS="false"
              SHOULD_BUILD="true"
              # Push to ECR only on push event to prod branch
              if [[ "$IS_PUSH" == "true" ]]; then
                SHOULD_PUSH="true"
              else
                SHOULD_PUSH="false"
              fi
              ;;
            *)
              # For any other branch: build and test, but do NOT push to ECR
              ENVIRONMENT=""
              RUN_TESTS="true"
              SHOULD_BUILD="true"
              SHOULD_PUSH="false"
              echo "ℹ️  Branch '$BRANCH' is not a deployment branch. Tests and build will run, but ECR push will be skipped."
              ;;
          esac
          
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "run-tests=$RUN_TESTS" >> $GITHUB_OUTPUT
          echo "is-push-event=$IS_PUSH" >> $GITHUB_OUTPUT
          echo "should-build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "should-push=$SHOULD_PUSH" >> $GITHUB_OUTPUT
          
          echo "✅ Environment: $ENVIRONMENT"
          echo "✅ Event: $EVENT_NAME"
          echo "✅ Branch: $BRANCH"
          echo "✅ Run Tests: $RUN_TESTS"
          echo "✅ Push Event: $IS_PUSH"
          echo "✅ Should Push: $SHOULD_PUSH"

  get-services:
    name: Get Services from SSM
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.should-push == 'true'
    outputs:
      services: ${{ steps.set-services.outputs.services }}
      aws_region: ${{ steps.set-services.outputs.aws_region }}
      branch: ${{ needs.determine-environment.outputs.branch }}
      environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739962689681:role/GithubActionRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR Repository URLs from SSM
        id: set-services
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          BRANCH="${{ needs.determine-environment.outputs.branch }}"
          AWS_REGION="${{ env.AWS_REGION }}"
          SSM_PARAMETER="/bluocean/riskgps/${ENVIRONMENT}/ec2/credentials"
          
          echo "🔍 Fetching Services Configuration:"
          echo "  Branch: $BRANCH"
          echo "  Environment: $ENVIRONMENT"
          echo "  AWS Region: $AWS_REGION"
          echo "  SSM Parameter: $SSM_PARAMETER"
          
          # Fetch SSM parameter with error handling
          CREDENTIALS=$(aws ssm get-parameter \
            --name "$SSM_PARAMETER" \
            --region "$AWS_REGION" \
            --with-decryption \
            --query Parameter.Value \
            --output text 2>&1)
          
          if [ $? -ne 0 ]; then
            echo "❌ Error: Failed to retrieve SSM parameter: $SSM_PARAMETER"
            echo "Return value: $CREDENTIALS"
            exit 1
          fi
          
          # Extract AWS region from availability_zone (e.g., "us-east-1a" -> "us-east-1")
          AWS_REGION=$(echo "$CREDENTIALS" | jq -r '.availability_zone' | sed 's/[a-z]$//')
          
          # Parse repository URLs and extract service names from object keys
          # ecr_registry_repository_urls structure: {"backend": "...", "frontend": "..."}
          SERVICES=$(echo "$CREDENTIALS" | jq -r '.ecr_registry_repository_urls | keys | @json' 2>&1)
          
          if [ $? -ne 0 ] || [ -z "$SERVICES" ] || [ "$SERVICES" = "[]" ]; then
            echo "❌ Error: No services found or failed to parse ecr_registry_repository_urls"
            echo "Services output: $SERVICES"
            exit 1
          fi
          
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "✅ Services detected: $SERVICES"
          echo "✅ AWS Region extracted: $AWS_REGION"

  run-tests:
    name: Run Tests (${{ needs.determine-environment.outputs.environment }} Environment)
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.run-tests == 'true'
    strategy:
      matrix:
        service: ["frontend", "backend"]
    defaults:
      run:
        working-directory: ./${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies for ${{ matrix.service }}"
          npm ci || { echo "❌ Failed to install dependencies"; exit 1; }

      - name: Run unit tests
        run: |
          echo "🧪 Running tests for ${{ matrix.service }}"
          npm test -- --passWithNoTests 2>&1 || echo "⚠️ Tests had issues but continuing workflow"
          echo "✅ Test step completed for ${{ matrix.service }}"

  scan-files:
    name: Scan Source Files with Trivy (${{ needs.determine-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.should-build == 'true'
    strategy:
      matrix:
        service: ["frontend", "backend"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies for ${{ matrix.service }}"
          cd ${{ matrix.service }}
          npm ci || { echo "❌ Failed to install dependencies"; exit 1; }

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  build-scan-push:
    name: Build, Scan, and Push to ECR
    runs-on: ubuntu-latest
    needs: [scan-files, determine-environment, run-tests]
    if: |
      always() &&
      needs.determine-environment.outputs.should-build == 'true' &&
      (needs.scan-files.result == 'success' || needs.scan-files.result == 'skipped') &&
      (needs.run-tests.result == 'success' || needs.run-tests.result == 'skipped')
    env:
      BRANCH: ${{ needs.determine-environment.outputs.branch }}
      ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
      SHOULD_PUSH: ${{ needs.determine-environment.outputs.should-push }}
    strategy:
      matrix:
        service: ["frontend", "backend"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure AWS Credentials
        if: env.SHOULD_PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739962689681:role/GithubActionRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR Repository URLs and Versioning from SSM
        if: env.SHOULD_PUSH == 'true'
        shell: bash
        run: |
          ENVIRONMENT="${{ env.ENVIRONMENT }}"
          SERVICE="${{ matrix.service }}"
          AWS_REGION="${{ env.AWS_REGION }}"
          BRANCH="${{ env.BRANCH }}"
          SSM_PARAMETER="/bluocean/riskgps/${ENVIRONMENT}/ec2/credentials"
          
          echo "🔍 Fetching Build Configuration:"
          echo "  Branch: $BRANCH"
          echo "  Environment: $ENVIRONMENT"
          echo "  Service: $SERVICE"
          echo "  AWS Region: $AWS_REGION"
          echo "  SSM Parameter: $SSM_PARAMETER"
          
          # Fetch EC2 credentials from SSM (with decryption)
          CREDENTIALS=$(aws ssm get-parameter \
            --name "$SSM_PARAMETER" \
            --region "$AWS_REGION" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text 2>&1)
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to fetch credentials from SSM: $SSM_PARAMETER"
            echo "Error: $CREDENTIALS"
            exit 1
          fi
          
          # Verify we got valid JSON
          echo "$CREDENTIALS" | jq . > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "❌ Invalid JSON returned from SSM parameter"
            exit 1
          fi
          
          # Extract ECR image URL for the specific service from SSM
          ECR_IMAGE=$(echo "$CREDENTIALS" | jq -r ".ecr_registry_repository_urls[\"$SERVICE\"]")
          
          if [ -z "$ECR_IMAGE" ] || [ "$ECR_IMAGE" = "null" ]; then
            echo "❌ Failed to find ECR repository URL for service: $SERVICE"
            echo "Available services: $(echo "$CREDENTIALS" | jq -r '.ecr_registry_repository_urls | keys | join(", ")')"
            exit 1
          fi
          
          # Extract ECR registry (everything before the last /)
          ECR_REGISTRY=$(echo "$ECR_IMAGE" | sed 's|/[^/]*$||')
          
          # Generate tag and image name
          MAJOR_VERSION="1"
          MINOR_VERSION="0"
          TAG="v${MAJOR_VERSION}.${MINOR_VERSION}.${{ github.run_number }}"
          IMAGE_NAME="${SERVICE}:${TAG}"
          ECR_IMAGE_WITH_TAG="${ECR_IMAGE}:${TAG}"
          
          echo ""
          echo "✅ Build Configuration Loaded:"
          echo "   Branch: $BRANCH"
          echo "   Environment: $ENVIRONMENT"
          echo "   Service: $SERVICE"
          echo "   AWS Region: $AWS_REGION"
          echo "   ECR Registry: $ECR_REGISTRY"
          echo "   ECR Repository: $ECR_IMAGE"
          echo "   Image Tag: $TAG"
          echo "   Full Image: $ECR_IMAGE_WITH_TAG"
          echo ""
          
          # Export as environment variables
          {
            echo "BRANCH=$BRANCH"
            echo "ENVIRONMENT=$ENVIRONMENT"
            echo "SERVICE=$SERVICE"
            echo "AWS_REGION=$AWS_REGION"
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "TAG=$TAG"
            echo "IMAGE_NAME=$IMAGE_NAME"
            echo "ECR_IMAGE=$ECR_IMAGE"
            echo "ECR_IMAGE_WITH_TAG=$ECR_IMAGE_WITH_TAG"
          } >> "$GITHUB_ENV"
          
          echo "✅ Environment variables exported to $GITHUB_ENV"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🔨 Building Docker image: ${{ env.IMAGE_NAME }}"
          cd ${{ matrix.service }}
          docker build -t ${{ env.IMAGE_NAME }} -f Dockerfile . 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "⚠️ Docker build exited with code $BUILD_EXIT, but continuing..."
          else
            echo "✅ Docker image built successfully"
          fi

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Tag Docker image
        if: env.SHOULD_PUSH == 'true'
        run: |
          echo "🏷️  Tagging image as: ${{ env.ECR_IMAGE_WITH_TAG }}"
          docker tag ${{ env.IMAGE_NAME }} ${{ env.ECR_IMAGE_WITH_TAG }} || { echo "❌ Failed to tag image"; exit 1; }
          echo "✅ Image tagged successfully"

      - name: Push Docker image to ECR
        if: env.SHOULD_PUSH == 'true'
        run: |
          echo "📤 Pushing image to ECR: ${{ env.ECR_IMAGE_WITH_TAG }}"
          docker push ${{ env.ECR_IMAGE_WITH_TAG }} || { echo "❌ Failed to push image to ECR"; exit 1; }
          echo "✅ Image pushed to ECR successfully"

      - name: Image Summary
        if: env.SHOULD_PUSH == 'true'
        run: |
          echo "📊 Build & Push Summary"
          echo "  Branch: ${{ env.BRANCH }}"
          echo "  Environment: ${{ env.ENVIRONMENT }}"
          echo "  Service: ${{ env.SERVICE }}"
          echo "  AWS Region: ${{ env.AWS_REGION }}"
          echo "  ECR Repository: ${{ env.ECR_IMAGE }}"
          echo "  Image with Tag: ${{ env.ECR_IMAGE_WITH_TAG }}"
          echo "  Tag: ${{ env.TAG }}"

      - name: Build Only Summary
        if: env.SHOULD_PUSH != 'true'
        run: |
          echo "📊 Build Only Summary (No ECR Push)"
          echo "  Branch: ${{ env.BRANCH }}"
          echo "  Service: ${{ env.SERVICE }}"
          echo "  Image: ${{ env.IMAGE_NAME }}"
          echo "  Note: ECR push skipped for non-deployment branches"

  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: always()
    steps:
      - name: Determine Summary Details
        id: summary-info
        run: |
          BRANCH="${{ needs.determine-environment.outputs.branch }}"
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          SHOULD_PUSH="${{ needs.determine-environment.outputs.should-push }}"
          RUN_TESTS="${{ needs.determine-environment.outputs.run-tests }}"
          EVENT="${{ github.event_name }}"
          
          # Determine push outcome
          PUSH_STATUS="Skipped (Feature Branch)"
          if [[ "$SHOULD_PUSH" == "true" ]]; then
            PUSH_STATUS="Pushed to ECR"
          fi
          
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "push_status=$PUSH_STATUS" >> $GITHUB_OUTPUT
          echo "run_tests=$RUN_TESTS" >> $GITHUB_OUTPUT

      - name: Generate Success Summary
        run: |
          BRANCH="${{ steps.summary-info.outputs.branch }}"
          ENVIRONMENT="${{ steps.summary-info.outputs.environment }}"
          PUSH_STATUS="${{ steps.summary-info.outputs.push_status }}"
          RUN_TESTS="${{ steps.summary-info.outputs.run_tests }}"
          
          ENV_DISPLAY="${ENVIRONMENT:-'Feature Branch'}"
          ENV_UPPER=$(echo "$ENV_DISPLAY" | tr '[:lower:]' '[:upper:]')
          
          echo "## 🎉 Docker Build and Push Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | $BRANCH |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | $ENV_UPPER |" >> $GITHUB_STEP_SUMMARY
          echo "| **Event Type** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests Run** | $RUN_TESTS |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECR Push** | $PUSH_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run Number** | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Workflow Details:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$ENVIRONMENT" == "dev" ]]; then
            echo "✅ **Dev Environment**: Tests, Build, Scan, and ECR Push Completed" >> $GITHUB_STEP_SUMMARY
          elif [[ "$ENVIRONMENT" == "prod" ]]; then
            echo "✅ **Prod Environment**: Build, Scan, and ECR Push Completed (Tests Skipped)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Feature Branch**: Tests and Build Completed (ECR Push Skipped)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Branch Configuration:" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Branches**: dev, prod" >> $GITHUB_STEP_SUMMARY
          echo "- **Current Branch**: $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- **Is Deployment Branch**: $([ '$ENVIRONMENT' != '' ] && echo 'Yes' || echo 'No')" >> $GITHUB_STEP_SUMMARY
          echo "- **Will Push to ECR**: $([ '$PUSH_STATUS' == 'Pushed to ECR' ] && echo 'Yes' || echo 'No')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$PUSH_STATUS" == "Pushed to ECR" ]]; then
            echo "### 🚀 Next Steps:" >> $GITHUB_STEP_SUMMARY
            echo "- Monitor the deployment pipeline" >> $GITHUB_STEP_SUMMARY
            echo "- Deploy will be automatically triggered" >> $GITHUB_STEP_SUMMARY
            echo "- Check ECR for the newly pushed images" >> $GITHUB_STEP_SUMMARY
            echo "- Verify image tags: v*.*.* format" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ Note:" >> $GITHUB_STEP_SUMMARY
            echo "- This is a feature branch build" >> $GITHUB_STEP_SUMMARY
            echo "- Image was built successfully but not pushed to ECR" >> $GITHUB_STEP_SUMMARY
            echo "- Merge to 'dev' or 'prod' branch to trigger ECR push and deployment" >> $GITHUB_STEP_SUMMARY
          fi

  trigger-deploy:
    name: Trigger Deployment Pipeline
    runs-on: ubuntu-latest
    needs: [determine-environment, build-scan-push]
    if: |
      always() &&
      needs.determine-environment.outputs.should-push == 'true' &&
      needs.build-scan-push.result == 'success'
    steps:
      - name: Trigger Deploy Workflow
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ needs.determine-environment.outputs.environment }}';
            const branch = '${{ needs.determine-environment.outputs.branch }}';
            
            console.log('🚀 Triggering deployment workflow');
            console.log(`   Environment: ${environment}`);
            console.log(`   Branch: ${branch}`);
            
            try {
              const response = await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                ref: branch,
                inputs: {
                  environment: environment
                }
              });
              
              console.log('✅ Deployment workflow triggered successfully');
              console.log(`   Response: ${response.status}`);
            } catch (error) {
              console.error('❌ Failed to trigger deployment workflow');
              console.error(`   Error: ${error.message}`);
              throw error;
            }
